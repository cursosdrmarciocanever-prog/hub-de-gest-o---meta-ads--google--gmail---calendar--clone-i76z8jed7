server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip basico
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API, admin (/_/), realtime e ROTAS DOS HOOKS -> container pocketbase.
    #
    # `/backend/` nao e' decoracao: TODAS as 12 rotas customizadas do hub vivem
    # sob /backend/v1/ (meta-ads/connect, meta-ads/sync, genie/chat, google/*,
    # config/status...). Este arquivo foi copiado do CRM, cuja unica rota
    # customizada e' /api/wa-inbound — e por isso la' o padrao (api|_) bastava.
    # Sem `backend` aqui, essas chamadas caem no `location /` abaixo e o nginx
    # devolve o index.html; o front tenta ler HTML como JSON e mostra
    # "Unexpected token '<'". O sintoma parece credencial errada, mas nenhuma
    # requisicao chegava ao PocketBase.
    #
    # `proxy_buffering off` e read_timeout longo sao necessarios para o
    # realtime (SSE) e para o streaming do Genie.
    location ~ ^/(api|_|backend)/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        client_max_body_size 25m; # uploads (ex.: exames/anexos)
    }

    # SPA: qualquer rota do React cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
